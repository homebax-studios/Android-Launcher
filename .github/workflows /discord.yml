name: Discord Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Files
        id: files
        shell: bash
        run: |
          FILES=""

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            OLD_SIZE=$(git cat-file -s "HEAD^:$FILE" 2>/dev/null || echo 0)

            if [ -f "$FILE" ]; then
              NEW_SIZE=$(stat -c%s "$FILE")
            else
              NEW_SIZE=0
            fi

            format_size() {
              local SIZE=$1

              if [ "$SIZE" -ge 1073741824 ]; then
                awk "BEGIN {printf \"%.2f GB\", $SIZE/1073741824}"
              elif [ "$SIZE" -ge 1048576 ]; then
                awk "BEGIN {printf \"%.2f MB\", $SIZE/1048576}"
              elif [ "$SIZE" -ge 1024 ]; then
                awk "BEGIN {printf \"%.2f KB\", $SIZE/1024}"
              else
                echo "${SIZE} B"
              fi
            }

            OLD_FORMATTED=$(format_size "$OLD_SIZE")
            NEW_FORMATTED=$(format_size "$NEW_SIZE")

            if [ "$OLD_SIZE" -eq 0 ]; then
              SIZE_INFO="New file: ${NEW_FORMATTED}"
            elif [ "$NEW_SIZE" -eq 0 ]; then
              SIZE_INFO="Deleted: ${OLD_FORMATTED}"
            else
              DIFF=$((NEW_SIZE - OLD_SIZE))

              if [ "$DIFF" -gt 0 ]; then
                DIFF_FORMATTED="+$(format_size "$DIFF")"
              elif [ "$DIFF" -lt 0 ]; then
                ABS_DIFF=$((DIFF * -1))
                DIFF_FORMATTED="-$(format_size "$ABS_DIFF")"
              else
                DIFF_FORMATTED="±0 B"
              fi

              SIZE_INFO="${OLD_FORMATTED} → ${NEW_FORMATTED} (${DIFF_FORMATTED})"
            fi

            if [ -z "$FILES" ]; then
              FILES="\`${FILE}\` — ${SIZE_INFO}"
            else
              FILES="${FILES}"$'\n'"\`${FILE}\` — ${SIZE_INFO}"
            fi

          done < <(git diff --name-only HEAD^ HEAD)

          if [ -z "$FILES" ]; then
            FILES="No changes"
          fi

          {
            echo 'changed_files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Get Commit Title and Description
        id: commit
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)

          DESCRIPTION=$(printf '%s\n' "$COMMIT_MESSAGE" \
            | tail -n +2 \
            | sed '/^[[:space:]]*$/d')

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="No description"
          fi

          {
            echo 'title<<EOF'
            echo "$TITLE"
            echo 'EOF'

            echo 'description<<EOF'
            echo "$DESCRIPTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord Embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
          COMMIT_DESCRIPTION: ${{ steps.commit.outputs.description }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ERROR: DISCORD_WEBHOOK secret is not configured."
            exit 1
          fi

          jq -n \
            --arg title "📱 HB Launcher - GitHub Update" \
            --arg description "GitHub code update | Public" \
            --arg commit_title "$COMMIT_TITLE" \
            --arg commit_description "$COMMIT_DESCRIPTION" \
            --arg author "$AUTHOR" \
            --arg branch "$BRANCH" \
            --arg changed_files "$CHANGED_FILES" \
            --arg commit_url "$COMMIT_URL" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  color: 34047,
                  fields: [
                    {
                      name: "📜 Title",
                      value: $commit_title,
                      inline: true
                    },
                    {
                      name: "📜 Description",
                      value: $commit_description,
                      inline: false
                    },
                    {
                      name: "👤 Author",
                      value: ("[@\($author)](https://github.com/\($author))"),
                      inline: true
                    },
                    {
                      name: "🌿 Branch",
                      value: ("`\($branch)`"),
                      inline: true
                    },
                    {
                      name: "🛠️ Changed Files",
                      value: $changed_files,
                      inline: false
                    },
                    {
                      name: "🔗 Commit",
                      value: ("[View commit](" + $commit_url + ")"),
                      inline: false
                    },
                    {
                      name: "🕐 Time",
                      value: $timestamp,
                      inline: false
                    }
                  ],
                  timestamp: $timestamp,
                  footer: {
                    text: "HB Launcher • Homebax Studios 2020–2026"
                  }
                }
              ]
            }' > payload.json

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord_response.txt \
            --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK")

          echo "Discord HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Discord webhook request failed."
            cat /tmp/discord_response.txt
            exit 1
          fi

          echo "Discord notification sent successfully."
